[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "comic-to-story"
dynamic = ["version"]
description = "CTS (Comic To Story): a multi-step CrewAI agent system that turns comic volumes into SFW or NSFW novels."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "KMC" }]
keywords = ["comics", "manga", "novel", "crewai", "agents", "llm", "gguf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Artistic Software",
]
dependencies = [
  # Agent framework. The extras pull the native Anthropic and Gemini SDKs.
  "crewai[anthropic,google-genai]>=1.15,<2",
  # Web backend
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # Pages, exports, paths, downloads
  "pillow>=10.0",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "platformdirs>=4.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
cts = "cts.cli:main"

[project.gui-scripts]
cts-gui = "cts.cli:main_gui"

[project.urls]
Homepage = "https://github.com/KMC1525/CTS"
Issues = "https://github.com/KMC1525/CTS/issues"

[tool.hatch.version]
path = "cts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cts"]

[tool.hatch.build.targets.sdist]
include = ["cts", "tests", "install.sh", "install.ps1", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
